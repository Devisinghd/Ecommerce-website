services:
  - type: web
    name: Ecommerce Website
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn mysite.wsgi:application --bind 0.0.0.0:10000 --workers 3
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "ecommerce-website-z90m.onrender.com,localhost,127.0.0.1"
      - key: DJANGO_SECRET_KEY
        value: "REPLACE_WITH_SECURE_SECRET"
      - key: DATABASE_URL
        fromDatabase: ecommerce-postgres-db
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"

databases:
  - name: ecommerce-postgres-db
    plan: free
    region: oregon
    databaseName: appdb
    postgresVersion: 18
